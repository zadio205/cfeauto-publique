[project]
name = "cfeauto"
version = "0.1.0"
description = "Récupération des avis CFE, attestations et messages de l'espace professionnel impots.gouv.fr pour un cabinet"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "playwright>=1.48",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
cfeauto = "cfeauto.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfeauto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
